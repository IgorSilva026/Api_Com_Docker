services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: piaget_db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - piaget_network
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $${MSSQL_SA_PASSWORD} -Q 'SELECT 1' -C || exit 1"]
      interval: 10s
      retries: 10
      start_period: 20s
      timeout: 5s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: piaget_api
    ports:
      - "8080:8080" # Apenas HTTP, sem HTTPS para evitar erro de certificado no Linux
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      # ForÃ§a a string de conexÃ£o para o container do banco
      - ConnectionStrings__ApiPiagetDoisContext=Server=db,1433;Database=PiagetAPI;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=true
    depends_on:
      db:
        condition: service_healthy
    networks:
      - piaget_network

volumes:
  sqlserver_data:

networks:
  piaget_network:
    driver: bridge
